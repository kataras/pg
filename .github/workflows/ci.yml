name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go_version: [1.27.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin!123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go_version }}

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -count=1 ./...

  # golangci-lint-action@v9 runs on Node 24. Anything up to v8 runs on Node 20, which GitHub has
  # deprecated, so the older pin produced a warning on every run. golangci-lint-action v7 and
  # later support golangci-lint v2 only, so .golangci.yml uses the v2 schema (generated by
  # `golangci-lint migrate`).
  #
  # golangci-lint v2.13 is a floor, not a preference: it is the first release built with Go 1.27,
  # and earlier builds cannot parse generic methods. Do not pin below it.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13
