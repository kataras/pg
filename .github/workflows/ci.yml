name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go_version: [1.26.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin!123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go_version }}

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -count=1 ./...

  # action@v9 runs on Node 24. Anything up to v8 runs on Node 20, which GitHub has deprecated,
  # so the older pin produced a warning on every run. Action v7 and later support golangci-lint
  # v2 only, so .golangci.yml uses the v2 schema (generated by `golangci-lint migrate`).
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.x

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12
