name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go_version: [1.26.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin!123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go_version }}

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -count=1 ./...

  # Intentionally pinned to the golangci-lint-action v1.x / golangci-lint v1.x line
  # (action@v6, version v1.62.2), NOT current. As of this pin, golangci-lint-action is at major
  # v9 and golangci-lint itself is at v2.12.2. This combination is internally consistent and
  # runs correctly as-is; it is simply behind. Upgrading past action v6 requires golangci-lint
  # v2, which in turn requires migrating .golangci.yml from the v1 schema
  # (linters.disable-all / issues.exclude-dirs) to the v2 schema (linters.enable / a separate
  # `formatters` section) - see .golangci.yml's header. That migration, plus the first-run wave
  # of new findings a newer linter would likely surface across this codebase's ~90+ freshly
  # written files, is a deliberate follow-up decision, not an oversight.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.x

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.62.2
