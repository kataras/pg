# golangci-lint configuration, v2 schema.
#
# Kept in step with the golangci-lint-action@v9 pin in .github/workflows/ci.yml.
# Action v7 and later drive golangci-lint v2 only, and v9 is the first that runs on
# Node 24 rather than the Node 20 that GitHub has deprecated. Changing either of the two
# means checking the other: the action validates this file against the JSON schema for
# the golangci-lint version it installs, so a v1-schema file fails the run outright
# rather than being ignored.
#
# The bar here is "find me a bug", not "make the code look like everyone else's". A lint
# job that reports things nobody intends to act on is a job people learn to skip, and
# then it catches nothing when it finally has something worth saying. So the set below is
# deliberately narrow, and every exclusion says why.
version: "2"

linters:
  default: standard

  disable:
    # errcheck insists every returned error is handled. Nearly everything it finds in this
    # repository is best-effort teardown in the live tests, a DROP TABLE that runs after
    # the assertions are already done, where a failure leaves nothing the test could
    # usefully report. The errors that actually matter here are on the query and
    # transaction paths, and those are covered by the tests rather than by a linter.
    #
    # This is not a claim that dropped errors never matter. It is a claim that a check
    # with this hit rate cannot tell the two apart, so it belongs in review rather than in
    # a gate.
    - errcheck

  settings:
    staticcheck:
      # staticcheck ships four families and only one of them finds bugs.
      #
      #   SA  - correctness: deprecated APIs, comparisons that are never true, values
      #         computed and then thrown away. This is the family worth failing a build
      #         over.
      #   S1  - simplifications. Opinion, and sometimes actively unwanted where a longer
      #         form is clearer about intent.
      #   ST1 - naming and comment style. Opinion, not correctness.
      #   QF1 - quickfix refactors: De Morgan rewrites, dropping an embedded type from a
      #         selector, tagged switches. Opinion, not correctness.
      checks:
        - all
        - -S1*
        - -ST1*
        - -QF1*

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      # _examples and _benchmarks are separate Go modules with their own go.mod, pinned to
      # older dependency versions through `replace`, and excluded from CI and dependabot
      # elsewhere. Keep the linter out of them too, in case it is ever invoked from the
      # repository root without module boundaries in effect.
      - _examples
      - _benchmarks
      # book/ is its own module as well: the ebook generator, built and vetted by its own
      # commands rather than by this job.
      - book
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - _examples
      - _benchmarks
      - book
      - third_party$
      - builtin$
      - examples$
