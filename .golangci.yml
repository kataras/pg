# golangci-lint v2 schema, generated by `golangci-lint migrate` from the previous v1 config and
# kept in step with the golangci-lint-action@v9 pin in .github/workflows/ci.yml. Action v7 and
# later support v2 only, and v9 is the first that runs on Node 24 rather than the deprecated
# Node 20.
#
# The default linter set (errcheck, govet, ineffassign, staticcheck, unused) is what runs here.
# No extra linters are enabled.
version: "2"

linters:
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      # _examples and _benchmarks are separate Go modules with their own go.mod, pinned to older
      # dependency versions through `replace`, and excluded from CI and dependabot elsewhere.
      # Keep the linter out of them too, in case it is ever invoked from the repository root
      # without module boundaries in effect.
      - _examples
      - _benchmarks
      # book/ is its own module as well: the ebook generator, built and vetted by its own
      # commands rather than by this job.
      - book
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - _examples
      - _benchmarks
      - book
      - third_party$
      - builtin$
      - examples$
