description: |
  A complete, hands-on guide to github.com/kataras/pg, a PostgreSQL library
  for Go built on pgx/v5. It covers declaring a schema with `pg` struct
  tags, connecting and configuring a pool, the generic Repository[T] for
  CRUD, the Conditions/Where query builder, pagination, writing data with
  upserts and conflict handling, bulk loading and streaming with COPY,
  transactions and retry, LISTEN/NOTIFY, schema management and migrations,
  introspection and code generation, and the security, observability and
  testing practices a production deployment needs, every example verified
  against the library source.
